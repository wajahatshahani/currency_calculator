<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexRate | Professional Currency Suite</title>
    <meta name="description" content="Free real-time currency converter with historical trends and multi-currency dashboard.">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .main-card, .sidebar-card {
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h1, h3 { margin-top: 0; }

        /* Input Styles */
        .input-group { margin-bottom: 20px; }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        .row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .row div { flex: 1; }

        /* Tools & Badges */
        .btn-convert {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Multi-Currency List */
        .currency-list { list-style: none; padding: 0; }
        .currency-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()">🌓</div>

<div class="container">
    <div class="main-card">
        <h1>Currency Converter</h1>
        <div class="input-group">
            <label>Amount</label>
            <input type="number" id="amount" value="100">
        </div>

        <div class="row">
            <div>
                <label>From</label>
                <select id="fromCurrency"></select>
            </div>
            <div style="flex:0; font-size: 1.5rem; padding-top: 20px;">⇄</div>
            <div>
                <label>To</label>
                <select id="toCurrency"></select>
            </div>
        </div>

        <div id="resultBox" style="text-align: center; margin: 20px 0;">
            <div style="font-size: 0.9rem; opacity: 0.7;" id="rateText">1 USD = 0.94 EUR</div>
            <div style="font-size: 2.5rem; font-weight: 800;" id="finalAmount">--</div>
        </div>

        <canvas id="trendChart" style="width:100%; height:200px; margin-top: 20px;"></canvas>
    </div>

    <div class="sidebar-card">
        <h3>Live Market</h3>
        <p style="font-size: 0.8rem; opacity: 0.6;">Rates for 1 <span class="base-unit">USD</span></p>
        <ul class="currency-list" id="quickList">
            </ul>
        <button class="btn-convert" style="margin-top: 20px; font-size: 0.9rem;" onclick="updateRates()">Refresh Rates</button>
    </div>
</div>

<script>
    const API_URL = "https://open.er-api.com/v6/latest/";
    const currencies = ["USD", "EUR", "GBP", "JPY", "AUD", "CAD", "INR", "CNY", "AED"];
    
    // Initialize
    async function init() {
        const from = document.getElementById('fromCurrency');
        const to = document.getElementById('toCurrency');
        
        currencies.forEach(cur => {
            from.innerHTML += `<option value="${cur}">${cur}</option>`;
            to.innerHTML += `<option value="${cur}">${cur}</option>`;
        });

        from.value = localStorage.getItem('from') || "USD";
        to.value = localStorage.getItem('to') || "EUR";
        
        updateRates();
        initChart();
    }

    async function updateRates() {
        const amount = document.getElementById('amount').value;
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;
        
        // Save preferences
        localStorage.setItem('from', from);
        localStorage.setItem('to', to);

        try {
            const res = await fetch(API_URL + from);
            const data = await res.json();
            const rate = data.rates[to];
            
            // Update Main
            document.getElementById('rateText').innerText = `1 ${from} = ${rate.toFixed(4)} ${to}`;
            document.getElementById('finalAmount').innerText = (amount * rate).toLocaleString(undefined, {minimumFractionDigits: 2});

            // Update Sidebar
            const list = document.getElementById('quickList');
            list.innerHTML = "";
            document.querySelectorAll('.base-unit').forEach(el => el.innerText = from);
            
            ["EUR", "GBP", "JPY", "INR"].forEach(cur => {
                if(cur !== from) {
                    const r = data.rates[cur];
                    list.innerHTML += `<li class="currency-item"><span>${cur}</span> <b>${r.toFixed(2)}</b></li>`;
                }
            });
        } catch (e) { console.error("Rate fetch failed"); }
    }

    // Modern Trend Chart (Mock data for visualization)
    function initChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Weekly Trend',
                    data: [1.02, 1.05, 1.01, 1.08, 1.07, 1.10, 1.09],
                    borderColor: '#6366f1',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(99, 102, 241, 0.1)'
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
        });
    }

    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', theme === 'dark' ? 'light' : 'dark');
    }

    // Listeners
    document.getElementById('fromCurrency').addEventListener('change', updateRates);
    document.getElementById('toCurrency').addEventListener('change', updateRates);
    document.getElementById('amount').addEventListener('input', updateRates);

    init();
</script>
</body>
</html>
